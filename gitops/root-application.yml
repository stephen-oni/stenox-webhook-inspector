apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stenox-root-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/stenox-webhook-inspector.git # Replace with your repo URL
    targetRevision: HEAD
    path: gitops
    directory:
      recurse: false
      include: stenox-dev-app.yml # Only deploys the dev application
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true