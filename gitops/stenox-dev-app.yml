apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stenox-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/stephenoni67/stenox-webhook-inspector.git'
    targetRevision: HEAD
    path: k8s/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true